<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="fill" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#4750DD"/>
      <stop offset="1" stop-color="#05C274"/>
    </linearGradient>
  </defs>

  <rect width="960" height="310" rx="24" fill="#212161"/>

  <!-- Escala: la pista va de x=250 a x=730 (480 px = 10 puntos); filas cada 70 px desde y=50 -->
  <g font-size="15" transform="translate(-60,-90)">
    <!-- Serio: 9 -->
    <g transform="translate(0,140)">
      <text x="230" y="5" text-anchor="end" fill="#B8BCE0">Divertido</text>
      <rect x="250" y="-6" width="480" height="12" rx="6" fill="#2E3560"/>
      <rect x="250" y="-6" width="432" height="12" rx="6" fill="url(#fill)"/>
      <circle cx="682" cy="0" r="13" fill="#BCFB89" stroke="#212161" stroke-width="3"/>
      <text x="758" y="5" font-weight="700" fill="#FFFFFF">Serio</text>
      <rect x="860" y="-15" width="62" height="30" rx="15" fill="#BCFB89"/>
      <text x="891" y="5" text-anchor="middle" font-weight="700" fill="#0D1127">9/10</text>
    </g>
    <!-- Formal: 7 -->
    <g transform="translate(0,210)">
      <text x="230" y="5" text-anchor="end" fill="#B8BCE0">Casual</text>
      <rect x="250" y="-6" width="480" height="12" rx="6" fill="#2E3560"/>
      <rect x="250" y="-6" width="336" height="12" rx="6" fill="url(#fill)"/>
      <circle cx="586" cy="0" r="13" fill="#BCFB89" stroke="#212161" stroke-width="3"/>
      <text x="758" y="5" font-weight="700" fill="#FFFFFF">Formal</text>
      <rect x="860" y="-15" width="62" height="30" rx="15" fill="#BCFB89"/>
      <text x="891" y="5" text-anchor="middle" font-weight="700" fill="#0D1127">7/10</text>
    </g>
    <!-- Respetuoso: 10 -->
    <g transform="translate(0,280)">
      <text x="230" y="5" text-anchor="end" fill="#B8BCE0">Irreverente</text>
      <rect x="250" y="-6" width="480" height="12" rx="6" fill="#2E3560"/>
      <rect x="250" y="-6" width="480" height="12" rx="6" fill="url(#fill)"/>
      <circle cx="730" cy="0" r="13" fill="#BCFB89" stroke="#212161" stroke-width="3"/>
      <text x="758" y="5" font-weight="700" fill="#FFFFFF">Respetuoso</text>
      <rect x="860" y="-15" width="62" height="30" rx="15" fill="#BCFB89"/>
      <text x="891" y="5" text-anchor="middle" font-weight="700" fill="#0D1127">10/10</text>
    </g>
    <!-- Sereno: 8 -->
    <g transform="translate(0,350)">
      <text x="230" y="5" text-anchor="end" fill="#B8BCE0">Entusiasta</text>
      <rect x="250" y="-6" width="480" height="12" rx="6" fill="#2E3560"/>
      <rect x="250" y="-6" width="384" height="12" rx="6" fill="url(#fill)"/>
      <circle cx="634" cy="0" r="13" fill="#BCFB89" stroke="#212161" stroke-width="3"/>
      <text x="758" y="5" font-weight="700" fill="#FFFFFF">Sereno</text>
      <rect x="860" y="-15" width="62" height="30" rx="15" fill="#BCFB89"/>
      <text x="891" y="5" text-anchor="middle" font-weight="700" fill="#0D1127">8/10</text>
    </g>
  </g>
</svg>
